[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cascadegen"
version = "0.1.0"
description = "Standalone RISC-V ELF generator extracted from the Cascade CPU fuzzer"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
cascade-gen = "cascadegen.cli:main"

[tool.setuptools.packages.find]
include = ["cascadegen*"]
